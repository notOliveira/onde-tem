services:
  db:
    image: postgis/postgis:18-3.6
    container_name: onde-tem-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - onde-tem-network

  api:
    build: .
    container_name: onde-tem-api
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - onde-tem-network
  
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    networks:
      - onde-tem-network
    env_file:
      - .env
    entrypoint: [
      "migrate",
      "-path=/migrations",
      "-database=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}"
    ]
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  onde-tem-network:
    driver: bridge