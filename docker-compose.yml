services:
  db:
    image: postgis/postgis:16-3.4
    container_name: onde-tem-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onde-tem-network

  api:
    build: .
    container_name: onde-tem-api
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - onde-tem-network
  
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    networks:
      - onde-tem-network
    entrypoint: [
      "migrate",
      "-path=/migrations",
      "-database=postgres://postgres:admin@db:5432/onde_tem?sslmode=disable"
    ]
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  onde-tem-network:
    driver: bridge